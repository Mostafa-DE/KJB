[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
datastore = "1.3.0"
serialization = "1.12.0"
coroutines = "1.11.0"
junit = "4.13.2"
# Latest stable on Google Maven on 2026-11-01 (onTimeout handling for foreground workers since 2.10).
work = "2.12.0"
# The NPU stack, exactly as measured on the phone by lyrify-npu-spike and matched to the AI Hub Whisper assets
# (Whisper-Large-V3-Turbo v0.65.0, precompiled_qnn_onnx, built with QAIRT 2.50.0.260828221209 and ONNX Runtime 1.30.0).
# ONNX Runtime core: the version the assets were exported with (the QNN plugin EP needs >= 1.24.1).
onnxruntime = "1.30.0"
# Qualcomm's plugin QNN execution provider (github.com/onnxruntime/onnxruntime-qnn): 2.6.0 is the release built and tested
# with QAIRT 2.50 (2.7.0 moved to QAIRT 2.51). The AAR holds only libonnxruntime_providers_qnn.so.
qnnEp = "2.6.0"
# The QNN runtime libraries (libQnnHtp.so, the Hexagon stub and skel libraries): build v2.50.0.260828221209, the QAIRT
# build AI Hub compiled the Whisper context binaries with.
qnnRuntime = "2.50.0"
# Covers in the song list and on the now-playing card, from MediaStore (no network artifact). Built with Kotlin 2.4.10 and
# Compose 1.12.0; published 2026-09-18.
coil = "3.6.3"
# KJB 3.0's player (milestone M0 adds every 3.0 dependency at once): Media3 1.11.1, the latest stable on Google Maven on
# 2026-11-09 (1.12 is alpha). Many of its APIs are @UnstableApi, opted in per file; Media3 is upgraded only on purpose,
# with the device tests. Not used: media3-ui, media3-ui-compose (KJB draws its own UI), media3-cast (proprietary Cast SDK).
media3 = "1.11.1"
# The home-screen widgets (milestone A3): Glance 1.2.0, the latest stable on Google Maven on 2026-11-10 (1.3 is alpha).
# Its default minSdk is 23; it brings WorkManager and DataStore, both already in the app.
glance = "1.2.0"
# Device tests (app/src/androidTest), run on the debug build only. androidx.test 1.7.0, ext-junit 1.3.0 and Espresso
# 3.7.0, the latest stable on Google Maven on 2026-11-10 (released 2025-07-30; 1.8.0 and 3.8.0 are alpha). Espresso is
# named here because Compose's ui-test 1.12.1 still asks for 3.5.0, whose input injection reflects on
# InputManager.getInstance, gone on Android 17: every Compose device test failed at setup. 3.7.0-alpha04 moved it to
# getSystemService ("Espresso" release notes, developer.android.com/jetpack/androidx/releases/test).
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
# The Baseline Profile (:baselineprofile, read 2026-11-10). Macrobenchmark and its Gradle plugin 1.5.0, the latest stable
# on Google Maven (2026-09-09; 1.6 is alpha): the plugin supports AGP 8.0 up to 10.0 and no longer needs newDsl=false
# on AGP 9 (benchmark release notes, 1.5.0-alpha01). profileinstaller 1.4.1 and benchmark-macro-junit4 1.5.0 are the
# minimum stable versions developer.android.com lists ("Baseline Profiles overview"). UiAutomator 2.4.0, the version
# Macrobenchmark 1.5.0 itself depends on, for its onElement { } calls.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
# The Downloads add-on's engine (dl-addon/), VidGrab's: yt-dlp on a Termux-built Python 3.12, with ffmpeg and QuickJS
# (youtubedl-android 0.18.1, the latest on Maven Central on 2026-11-14, published 2025-11-16 with yt-dlp 2025.11.12;
# yt-dlp updates itself in the add-on after that). Pinned; moved to a newer release only on purpose. Its aria2c artifact
# is not used: nothing passes --downloader.
youtubedlAndroid = "0.18.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Compose UI tests on the phone (app/src/androidTest); the manifest part adds the empty activity they draw in, debug builds only.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-qnn-ep = { group = "com.qualcomm.qti", name = "onnxruntime-android-qnn", version.ref = "qnnEp" }
qnn-runtime = { group = "com.qualcomm.qti", name = "qnn-runtime", version.ref = "qnnRuntime" }
# The JVM build of the same ONNX Runtime, for unit tests only: IoTensorsTest runs the app's uint16 tensors (made by
# reflection into ONNX Runtime's Java classes) through it on the laptop.
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
media3-test-utils = { group = "androidx.media3", name = "media3-test-utils", version.ref = "media3" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
# Installs the Baseline Profile on the phone at first run: KJB ships as an APK, not through Google Play.
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
youtubedl-android-library = { group = "io.github.junkfood02.youtubedl-android", name = "library", version.ref = "youtubedlAndroid" }
youtubedl-android-ffmpeg = { group = "io.github.junkfood02.youtubedl-android", name = "ffmpeg", version.ref = "youtubedlAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
